[package]
name = "gigatype"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "Fast local Russian voice typing powered by GigaAM"
license = "MIT"
repository = "https://github.com/kpoxo6op/gigatype"
readme = "README.md"
keywords = ["speech-to-text", "dictation", "russian", "wayland", "gigaam"]
categories = ["accessibility", "multimedia::audio"]

[dependencies]
arboard = { version = "3.6", default-features = false }
cpal = { version = "0.18.1", features = ["pulseaudio"] }
enigo = "0.5"
global-hotkey = "0.8"
hound = "3.5"
libc = "0.2"
ort = { version = "=2.0.0-rc.10", features = ["download-binaries", "copy-dylibs"] }
rustfft = "6.4"
sentencepiece-rust = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = "=0.10.2"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time"] }
url = "=2.5.2"
wl-clipboard-rs = "0.9.3"
zbus = { version = "=5.13.2", default-features = false, features = ["tokio"] }
zbus_macros = "=5.13.2"
zbus_names = "=4.3.1"
zvariant = "=5.9.2"
zvariant_derive = "=5.9.2"
zvariant_utils = "=3.3.0"

[dev-dependencies]
tempfile = "3"
