[package]
name = "gigatype"
version = "0.1.1"
edition = "2021"
description = "Fast local Russian voice typing powered by GigaAM"
license = "MIT"
repository = "https://github.com/kpoxo6op/gigatype"
readme = "README.md"
keywords = ["speech-to-text", "dictation", "russian", "kde", "gigaam"]
categories = ["accessibility", "multimedia::audio"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
