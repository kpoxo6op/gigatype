name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes cmake libasound2-dev libssl-dev pkg-config
      - run: cargo fmt --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked

  scripts-and-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install linters
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Check shell scripts
        run: |
          bash -n scripts/*.sh packaging/appimage/*.sh packaging/appimage/AppRun
          shellcheck scripts/*.sh packaging/appimage/*.sh packaging/appimage/AppRun
      - name: Check package metadata
        run: |
          test -f packaging/debian/control
          test -f packaging/rpm/gigatype.spec
          test -f packaging/homebrew/gigatype.rb
          test -f flake.nix
          grep -q 'Version:        0.3.0' packaging/rpm/gigatype.spec
          grep -q 'version = "0.3.0"' flake.nix
